name: Build Whisper Android APK

on:
workflow_dispatch:
push:
paths:
- '.github/workflows/android.yml'

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '21'

  - name: Extract project
    run: |
      mkdir -p "$RUNNER_TEMP/whisper"
      unzip -q WhisperProject.zip -d "$RUNNER_TEMP/whisper"

      PROJECT_DIR=$(find "$RUNNER_TEMP/whisper" -type f -name package.json \
        -not -path '*/node_modules/*' \
        -exec sh -c 'd=$(dirname "$1"); if [ -d "$d/android" ]; then echo "$d"; fi' _ {} \; \
        | head -n 1)

      if [ -z "$PROJECT_DIR" ]; then
        echo "Project with package.json and android folder not found"
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Install dependencies
    run: npm install
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Build web project
    run: npm run build
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Sync Android
    run: npx cap sync android
    working-directory: ${{ env.PROJECT_DIR }}

  - name: Build APK
    run: |
      chmod +x android/gradlew
      cd android
      ./gradlew assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Whisper-Android-APK
      path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
