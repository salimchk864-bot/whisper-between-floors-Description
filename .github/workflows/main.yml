name: Build Whisper Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WhisperProject.zip'
      - '.github/workflows/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          mkdir whisper
          unzip -q WhisperProject.zip -d whisper

          PROJECT_DIR=$(find whisper -name package.json \
            -not -path '*/node_modules/*' \
            -exec sh -c 'd=$(dirname "$1"); if [ -d "$d/android" ]; then echo "$d"; fi' _ {} \; \
            | head -n 1)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Project files not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: cd "$PROJECT_DIR" && npm install

      - name: Build game
        run: cd "$PROJECT_DIR" && npm run build

      - name: Sync Android
        run: cd "$PROJECT_DIR" && npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Whisper-Android-APK
          path: whisper/**/android/app/build/outputs/apk/debug/app-debug.apk
